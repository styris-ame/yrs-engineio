[package]
name = "yrs-engineio"
version = "0.8.2"
edition = "2021"
description = "Yrs synchronization protocol over engine.io (engineioxide)"
license = "MIT"
keywords = ["crdt", "yrs", "engine.io"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
yrs = { version = "0.26.0", features = ["sync"] }
futures-util = { version = "0.3", features = ["sink"] }
tokio = { version = "1.52", features = ["rt", "net", "sync", "macros"] }
tracing = { version = "0.1", features = ["log"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
engineioxide = "0.17.5"
bytes = "1.11"
kanal = "0.1.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
